<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Lab — A Cozy Research Adventure</title><style>
:root{font-family:'Trebuchet MS',system-ui,sans-serif;color:#455444;background:#f6f1dd}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:2px solid #70846a;border-radius:14px;padding:10px 14px;background:#fff8e8;color:#455444;box-shadow:0 3px #b8bda0}button:hover{background:#e7f0d6}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1100px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:29px;font-weight:900;color:#5f7857}.stats{display:flex;gap:9px;flex-wrap:wrap}.pill{border-radius:30px;background:#fffdf3;border:2px solid #d6ddbf;padding:8px 13px}.world{position:relative;overflow:hidden;min-height:460px;border:7px solid #fff9e8;border-radius:30px;background:#b9d58f;box-shadow:0 8px 0 #d7d9bd;margin-top:18px}.sky{position:absolute;inset:0;background:radial-gradient(circle at 77% 17%,#fdf3b1 0 46px,transparent 47px),linear-gradient(#c9e9d9 0 40%,#b9d58f 40%)}.hill{position:absolute;width:80%;height:50%;background:#a3c681;border-radius:50%;bottom:-22%;left:-20%}.hill.two{left:45%;bottom:-26%;background:#a7cc88}.pond{position:absolute;right:6%;bottom:13%;width:31%;height:30%;border:10px solid #e8ddaa;background:#83c9c9;border-radius:50% 40% 53% 45%;transform:rotate(-9deg)}.path{position:absolute;left:24%;bottom:-25%;width:38%;height:85%;background:#e8d0a0;border-radius:50%;transform:rotate(-29deg)}.cottage{position:absolute;left:13%;top:23%;width:31%;height:42%;background:#fff3d7;border:5px solid #aa8b70;border-radius:15px 15px 24px 24px;box-shadow:8px 10px #91ad77}.roof{position:absolute;left:-9%;top:-27%;width:118%;height:37%;background:#d99b87;clip-path:polygon(50% 0,100% 100%,0 100%)}.door{position:absolute;left:40%;bottom:0;width:23%;height:47%;border-radius:35px 35px 0 0;background:#9dbaa1;border:4px solid #738f79}.window{position:absolute;top:28%;left:13%;width:22%;height:26%;border:4px solid #c4a17d;background:#c8e8e1;border-radius:9px}.tree{position:absolute;font-size:75px;filter:drop-shadow(4px 6px #92b17c)}.flower{position:absolute;font-size:27px}.spot{position:absolute;border:0;background:#fff8e6e8;padding:8px 12px;border-radius:18px;font-weight:bold;box-shadow:0 3px #b3bb93;z-index:2}.spot:hover{transform:translateY(-2px)}.character{position:absolute;left:50%;bottom:20%;font-size:55px;filter:drop-shadow(2px 5px #8eac7a)}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.panel{background:#fffdf3;border:3px solid #d7dfc2;border-radius:23px;padding:20px;min-height:210px}.panel h2{margin:0 0 10px;font-size:20px}.panel p{line-height:1.5}.actions{display:flex;gap:9px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#34463d99;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.dialog{background:#fffdf3;border:6px solid #d4ddbd;border-radius:25px;padding:23px;max-width:650px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 12px 0 #4d665d55}.dialog h2{margin:0 0 12px}.choice{display:block;width:100%;text-align:left;margin:9px 0}.choice.selected{background:#d8e9c8}.note{background:#eaf2db;padding:13px;border-radius:14px;margin:12px 0}.small{font-size:13px;opacity:.78}.close{float:right}.decor{font-size:32px;letter-spacing:12px}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#455f4d;color:white;border-radius:18px;padding:12px 18px;display:none;z-index:20}@media(max-width:650px){.world{min-height:410px}.bottom{grid-template-columns:1fr}.tree{font-size:54px}.cottage{left:8%;width:43%}.pond{right:3%;width:38%}.brand{font-size:25px}.spot{font-size:12px;padding:7px}.character{font-size:40px}}

/* Version 2 exploration and lab additions */
.world{touch-action:none;cursor:crosshair}.character{z-index:4;transition:left .22s linear,top .22s linear,bottom .22s linear;pointer-events:none}.spot{z-index:5}.lab-room{position:relative;height:280px;overflow:hidden;border-radius:20px;background:linear-gradient(90deg,#e5d6bf 49%,#d6c5b0 50%);border:6px solid #fff3db}.lab-room:before{content:"";position:absolute;bottom:0;width:100%;height:42%;background:repeating-linear-gradient(45deg,#bda58f 0 24px,#d5bda6 24px 48px)}.lab-furniture{position:absolute;font-size:38px;filter:drop-shadow(2px 5px 1px #8b7765);cursor:pointer;border:0;background:transparent;box-shadow:none}.lab-furniture:hover{transform:scale(1.08);background:transparent}.lab-avatar{position:absolute;bottom:18%;left:46%;font-size:46px;pointer-events:none}.walkhint{position:absolute;bottom:8px;left:12px;background:#fff9e4c9;padding:5px 10px;border-radius:20px;font-size:12px;z-index:5}.specimen{position:absolute;z-index:3;border:0;background:transparent;box-shadow:none;font-size:30px;padding:4px;animation:bob 2.3s ease-in-out infinite}.specimen:hover{background:transparent;transform:scale(1.12)}@keyframes bob{50%{translate:0 -6px}}.minigame{padding:15px;border-radius:17px;background:#e9f2dd}.mini-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}.mini-row input{accent-color:#668b66;width:180px}.meter{height:14px;border-radius:12px;background:#cbd6c5;overflow:hidden;flex:1;min-width:100px}.meter>span{display:block;height:100%;background:#82b49a}.plot{display:flex;align-items:end;gap:15px;height:120px;border-bottom:2px solid #889d80;margin:20px 0 8px;padding:0 20px}.bar{width:65px;border-radius:8px 8px 0 0;background:#8bbca5;position:relative}.bar:nth-child(2){background:#d6a991}.bar label{position:absolute;top:-25px;left:0;font-size:13px;white-space:nowrap}.world .tree,.world .flower{pointer-events:none}
</style></head><body><main class="shell"><header class="top"><div class="brand">🌿 Little Lab <span style="font-size:13px">a cozy research adventure</span></div><div class="stats"><span class="pill" id="day"></span><span class="pill" id="grants"></span><span class="pill" id="discoveries"></span></div></header><section class="world" aria-label="Island map"><div class="sky"></div><div class="hill"></div><div class="hill two"></div><div class="path"></div><div class="pond"></div><div class="tree" style="top:6%;right:17%">🌳</div><div class="tree" style="top:17%;right:2%">🌲</div><div class="tree" style="bottom:4%;left:2%">🌲</div><div class="flower" style="bottom:17%;left:37%">🌼</div><div class="flower" style="top:25%;right:34%">🌷</div><div class="cottage"><div class="roof"></div><div class="window"></div><div class="door"></div></div><div class="character" id="avatar">👩🏻‍🔬</div><button class="specimen" style="left:62%;top:55%" onclick="collectSpecimen('pond')" title="Collect water sample">🫙</button><button class="specimen" style="left:72%;top:15%" onclick="collectSpecimen('forest')" title="Observe a leaf">🍃</button><button class="specimen" style="left:8%;top:16%" onclick="collectSpecimen('garden')" title="Collect a seed">🌰</button><span class="walkhint">Tap the grass to walk · tap objects to explore</span><button class="spot" style="left:16%;top:62%" onclick="openLab()">🏡 Laboratory</button><button class="spot" style="right:7%;bottom:8%" onclick="visit('pond')">💧 Pond</button><button class="spot" style="right:7%;top:8%" onclick="visit('forest')">🌳 Forest</button><button class="spot" style="left:3%;top:8%" onclick="visit('garden')">🌱 Garden</button></section><section class="bottom"><article class="panel"><h2>📋 Today's research</h2><p id="quest"></p><div class="actions"><button onclick="openJournal()">📖 Field journal</button><button onclick="nextDay()">☀️ Next day</button></div></article><article class="panel"><h2>🏡 My cozy laboratory</h2><p id="labText"></p><div class="decor" id="decor"></div><div class="actions"><button onclick="openShop()">🪴 Decorate lab</button><button onclick="openHelp()">❔ How to play</button></div></article></section></main><div id="modal" class="modal" role="dialog" aria-modal="true"><div class="dialog"><button class="close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div><div class="toast" id="toast"></div><script>
const studies=[{id:'pond',name:'The Quiet Pond',icon:'💧',item:'water samples',question:'Why are algae growing faster on the sunny side of the pond?',hypotheses:['Sunlight increases algae growth','Algae grow equally in all light conditions','The color of the sample jar causes growth'],correct:0,design:'Which experiment best tests the sunlight hypothesis?',designs:['Put identical algae samples in equal water and nutrients, changing only light exposure','Compare algae from different ponds with different temperatures','Give one sample extra fertilizer and more light'],designCorrect:0,results:'After seven days, illuminated samples averaged 18 algae clusters; shaded samples averaged 6.',conclusions:['The results support a positive effect of light under these conditions','Sunlight is proven to be the only influence on algae everywhere','The data show that fertilizer causes algae growth'],conclusionCorrect:0,fact:'Controlled experiments isolate a variable. Here light exposure changes while other conditions stay constant.'},{id:'forest',name:'The Forgetful Squirrels',icon:'🌳',item:'behavioral notes',question:'Do squirrels remember food locations better when landmarks are visible?',hypotheses:['Landmarks improve location recall','Landmarks always make memory worse','Squirrels can only use smell'],correct:0,design:'How should you compare the groups?',designs:['Use equal hiding trials and time delays, varying only landmark visibility','Test one squirrel in daylight and another at night with different foods','Let the landmark group practice twice as often'],designCorrect:0,results:'With landmarks, squirrels found 8 of 10 caches on average; without them, 5 of 10.',conclusions:['Landmarks may aid spatial recall in this task','All animal memory works exactly like human memory','The results prove that squirrels never use smell'],conclusionCorrect:0,fact:'Spatial memory helps organisms remember locations. Landmarks can provide retrieval cues.'},{id:'garden',name:'The Sleepy Seedlings',icon:'🌱',item:'seed specimens',question:'Does a longer dark period affect seedling growth?',hypotheses:['Different light-dark schedules may change growth','Every seedling grows exactly the same amount','Pot color determines the entire growth rate'],correct:0,design:'Choose a fair test.',designs:['Use the same species, soil, water and temperature; change only the light-dark schedule','Use different species in different soils','Water the dark-period group twice as much'],designCorrect:0,results:'After ten days, seedlings with a 12-hour dark period averaged 9 cm, versus 7 cm with a 6-hour dark period.',conclusions:['This schedule was associated with greater growth in the tested conditions','More darkness always causes more growth in all plants','Watering cannot affect seedlings'],conclusionCorrect:0,fact:'Circadian rhythms are approximately 24-hour biological cycles. Light-dark timing can influence plant physiology.'}];
const defaultState={day:1,grants:20,done:[],inventory:[],decor:[],visited:[],experiments:0};let state;try{state={...defaultState,...JSON.parse(localStorage.getItem('littlelab-save')||'{}')}}catch{state={...defaultState}}let active=null,stage=0,selected=-1;const $=id=>document.getElementById(id);function save(){localStorage.setItem('littlelab-save',JSON.stringify(state));render()}function render(){$('day').textContent='☀️ Day '+state.day;$('grants').textContent='🪙 '+state.grants+' grants';$('discoveries').textContent='🔎 '+state.done.length+'/3 discoveries';const next=studies.find(s=>!state.done.includes(s.id));$('quest').textContent=next?'Explore '+next.name+' and investigate its mystery. Gather a sample, form a hypothesis, and design a fair experiment.':'All three mysteries solved! Revisit the island, decorate your lab, or start a fresh expedition.';$('labText').textContent=state.decor.length?'Your cottage is becoming a wonderful place for curious minds.':'A quiet little cottage waiting for plants, books, and discoveries.';$('decor').textContent=state.decor.map(x=>({plant:'🪴',books:'📚',lamp:'🛋️',telescope:'🔭',cat:'🐈'})[x]).join(' ')}function show(html){$('modalBody').innerHTML=html;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function visit(id){active=studies.find(s=>s.id===id);if(!state.visited.includes(id)){state.visited.push(id);state.inventory.push(active.item);save()}show(`<h2>${active.icon} ${active.name}</h2><p>${active.question}</p><div class="note">You collected ${active.item}. ${state.done.includes(id)?'You have already completed this study.':'A new investigation awaits!'}</div><button onclick="startStudy()">${state.done.includes(id)?'Repeat experiment':'Begin investigation'}</button>`)}function startStudy(){stage=0;selected=-1;studyStep()}function studyStep(){const s=active;let title,prompt,choices;if(stage===0){title='1 · Make a hypothesis';prompt=s.question;choices=s.hypotheses}else if(stage===1){title='2 · Design the experiment';prompt=s.design;choices=s.designs}else if(stage===2){show(`<h2>3 · Observe the results</h2><p>After carefully collecting data, your notebook reads:</p><div class="note">📊 ${s.results}</div><p class="small">Experiments in Little Lab use fictional sample data to teach real scientific reasoning.</p><button onclick="stage=3;studyStep()">Interpret the evidence →</button>`);return}else{title='4 · Draw a conclusion';prompt='Which conclusion is justified by the evidence?';choices=s.conclusions}show(`<h2>${title}</h2><p>${prompt}</p>${choices.map((c,i)=>`<button class="choice ${selected===i?'selected':''}" onclick="selectChoice(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join('')}<div id="feedback"></div><button id="continue" disabled onclick="advance()">Continue →</button>`)}function selectChoice(i){selected=i;document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('selected',i===j));const correct=stage===0?active.correct:stage===1?active.designCorrect:active.conclusionCorrect;const good=i===correct;$('feedback').innerHTML=`<div class="note">${good?'✨ Excellent reasoning!':'🌼 Not quite. Think about what the evidence can actually establish.'} ${good?'':'Try another answer.'}</div>`;$('continue').disabled=!good}function advance(){selected=-1;stage++;if(stage<4){studyStep();return}const newStudy=!state.done.includes(active.id);if(newStudy){state.done.push(active.id);state.grants+=35;state.experiments++;save()}show(`<h2>✨ Discovery complete!</h2><p>You solved <b>${active.name}</b>.</p><div class="note">${active.fact}</div><p>${newStudy?'🪙 You earned 35 research grants!':'A good scientist can always repeat an experiment.'}</p><button onclick="closeModal()">Return to island</button>`)}function openJournal(){show(`<h2>📖 Field journal</h2><p>Every discovery begins with a question.</p>${studies.map(s=>`<div class="note"><b>${s.icon} ${s.name}</b> · ${state.done.includes(s.id)?'✓ Researched':'Not yet researched'}<p>${state.done.includes(s.id)?s.fact:'Visit this location to begin.'}</p></div>`).join('')}<p class="small">Specimens collected: ${state.inventory.length?state.inventory.join(', '):'none yet'}</p>`)}function oldOpenLab(){show(`<h2>🏡 The Little Laboratory</h2><p>A warm, peaceful home for your field notes and experiments.</p><div style="font-size:65px;text-align:center;background:#e9edda;border-radius:20px;padding:35px">🧪 📚 🪴 🔬</div><p>Research earns grants. Use them to make the lab your own.</p><button onclick="openShop()">Visit decoration shop</button>`)}const shop=[['plant','Potted fern',15,'🪴'],['books','Book collection',20,'📚'],['lamp','Reading nook',25,'🛋️'],['telescope','Telescope',35,'🔭'],['cat','Lab companion',50,'🐈']];function openShop(){show(`<h2>🪴 Cozy laboratory shop</h2><p>You have ${state.grants} grants. Research new mysteries to earn more.</p>${shop.map(([id,name,cost,icon])=>`<button class="choice" ${state.decor.includes(id)||state.grants<cost?'disabled':''} onclick="buy('${id}',${cost})">${icon} ${name} · ${cost} grants ${state.decor.includes(id)?'✓ owned':''}</button>`).join('')}`)}function buy(id,cost){if(state.decor.includes(id)||state.grants<cost)return;state.grants-=cost;state.decor.push(id);save();openShop();toast('A cozy new addition!')}function nextDay(){state.day++;save();toast('A fresh morning on the island ☀️')}function openHelp(){show(`<h2>🌼 Welcome to Little Lab</h2><p>Tap locations on the island to collect samples and investigate mysteries. Each study has four steps: propose a hypothesis, choose a controlled experiment, inspect data, and reach a justified conclusion.</p><p>Correctly completed studies earn research grants. Spend them on decorations. Your discoveries and decorations save automatically on this device.</p><p class="small">All study datasets are illustrative, not real experimental findings.</p><button onclick="resetGame()">Reset saved game</button>`)}function resetGame(){if(confirm('Erase all progress and start again?')){state=structuredClone(defaultState);save();closeModal()}}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});render();

// V2: Walkable island, a furnished room and interactive simulations.
const avatar=$('avatar');let player={x:50,y:68};function movePlayer(x,y){player.x=Math.max(7,Math.min(92,x));player.y=Math.max(12,Math.min(86,y));avatar.style.left=player.x+'%';avatar.style.top=player.y+'%';avatar.style.bottom='auto'}
document.querySelector('.world').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=e.currentTarget.getBoundingClientRect();movePlayer((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)});
function collectSpecimen(id){const s=studies.find(x=>x.id===id);if(!state.inventory.includes(s.item)){state.inventory.push(s.item);state.grants+=5;save();toast('Collected '+s.item+' · +5 grants')}else toast('Already recorded in your journal');}
function openLab(){let items=state.decor.map(id=>({plant:['🪴','left:7%;bottom:23%'],books:['📚','right:13%;top:20%'],lamp:['🛋️','right:6%;bottom:18%'],telescope:['🔭','left:52%;top:17%'],cat:['🐈','left:30%;bottom:17%']})[id]).filter(Boolean);show(`<h2>🏡 Your little laboratory</h2><p>Welcome home. Explore your workbench, examine specimens, and arrange your research space.</p><div class="lab-room"><button class="lab-furniture" style="left:12%;top:12%" onclick="openJournal()" title="Field journal">📖</button><button class="lab-furniture" style="left:39%;top:15%" onclick="openBench()" title="Experiment bench">🔬</button><button class="lab-furniture" style="right:12%;bottom:20%" onclick="openShop()" title="Decorate">🧰</button>${items.map(a=>`<span class="lab-furniture" style="${a[1]}">${a[0]}</span>`).join('')}<span class="lab-avatar">👩🏻‍🔬</span></div><div class="actions" style="margin-top:15px"><button onclick="openBench()">🔬 Run a simulation</button><button onclick="openShop()">🪴 Furnish room</button><button onclick="openJournal()">📖 Journal</button></div>`)}
function openBench(){show(`<h2>🔬 Research workbench</h2><p>Use these simplified interactive models to investigate the relationship between variables. These are educational simulations, not real experimental data.</p><div class="actions"><button onclick="runSimulation('light')">🌱 Plant photobiology</button><button onclick="runSimulation('memory')">🧠 Memory & retrieval</button><button onclick="runSimulation('pond')">💧 Pond ecology</button></div>`)}
let sim='light', simValue=50, simTrials=[];
function simulated(v){if(sim==='light')return Math.round(2+11*Math.exp(-Math.pow((v-65)/37,2))*10)/10;if(sim==='memory')return Math.round(10*(.2+.8*Math.exp(-v/42)))/10;return Math.round((4+v*.16)*10)/10}
function runSimulation(type){sim=type;simValue=50;simTrials=[];drawSim()}
function drawSim(){const data={light:['🌱 Plant photobiology','Light exposure','%','Simulated seedling growth (cm)','Change only the light exposure; soil, water and temperature remain constant.'],memory:['🧠 Memory & retrieval','Retention delay','minutes','Simulated recall (out of 10)','Explore how increasing the delay can reduce recall in a toy forgetting model.'],pond:['💧 Pond ecology','Light availability','%','Simulated algae clusters','Hold nutrients and temperature constant while changing light availability.']}[sim];const val=simValue;show(`<h2>${data[0]}</h2><p>${data[4]}</p><div class="minigame"><label for="varslider"><b>${data[1]}:</b> <span id="simVal">${val}</span> ${data[2]}</label><div class="mini-row"><input id="varslider" type="range" min="0" max="100" value="${val}" oninput="simValue=Number(this.value);document.getElementById('simVal').textContent=this.value;document.getElementById('pred').textContent=simulated(simValue)"><span class="pill">Predicted: <b id="pred">${simulated(val)}</b></span></div><button onclick="recordTrial()">Record trial</button></div><h3>Notebook · ${data[3]}</h3>${simTrials.length?`<div class="plot">${simTrials.map((t,i)=>`<div class="bar" style="height:${Math.max(7,t.y/(sim==='memory'?10:22)*100)}%"><label>${t.y}</label></div>`).join('')}</div><p class="small">Trial settings: ${simTrials.map(t=>t.x+data[2]).join(' · ')}</p>`:'<p class="small">No trials recorded yet. Move the slider and record at least two conditions.</p>'}<div class="actions"><button onclick="openBench()">← Workbench</button>${simTrials.length>=2?'<button onclick="finishSim()">File research notes</button>':''}</div>`}
function recordTrial(){if(simTrials.length>=6){toast('Maximum six trials per run');return}simTrials.push({x:simValue,y:simulated(simValue)});drawSim()}
function finishSim(){state.grants+=10;state.experiments++;save();show(`<h2>📓 Research notes filed</h2><p>You tested ${simTrials.length} experimental conditions and earned 10 research grants.</p><div class="note">Notice that changing an independent variable changes the model's predicted outcome. Real research also needs replication, measurement uncertainty and careful controls.</div><button onclick="openBench()">Back to workbench</button>`)}
</script></body></html>
