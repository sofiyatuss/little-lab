@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');:root{--ink:#4f5c4a;--paper:#fff9ec;--sage:#718b70;--line:#d9dfc5}*{box-sizing:border-box}body{margin:0;background:#f0eddf;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}button{font:inherit;cursor:pointer;border:1.5px solid #b9c6a9;border-radius:12px;background:#fffaf0;color:#53644f;padding:10px 15px;box-shadow:0 3px 0 #c8d0b5}button:hover{background:#e9f0dc}button:focus-visible{outline:3px solid #83a6a0}h1,h2,h3{font-family:Fraunces,Georgia,serif}h1{font-size:31px;margin:0}h2{margin:0 0 10px;font-size:24px}.app{max-width:1120px;margin:auto;padding:19px}.header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:15px}.subtitle{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#85967b}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#fffaf0;border:1px solid #d8dfc7;border-radius:30px;padding:9px 13px;font-size:13px}.stage{position:relative;border:9px solid #fffaf0;border-radius:26px;overflow:hidden;background:#b9d3a0;box-shadow:0 9px 0 #d9ddcb}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:1000/570;touch-action:none;cursor:crosshair}.hud{position:absolute;left:13px;top:13px;display:flex;gap:7px;flex-wrap:wrap}.hud button{font-size:12px;padding:8px 11px;background:#fffaf0ed}.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#fff9e8eb;border:1px solid #e1d6b8;border-radius:20px;padding:8px 13px;font-size:12px;text-align:center;white-space:nowrap;pointer-events:none}.below{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}.panel{background:#fffaf0;border:2px solid #e0e4d1;border-radius:19px;padding:19px;min-height:145px}.panel p{font-size:14px;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:9px}.modal{position:fixed;inset:0;background:#364a40a8;z-index:20;display:n </style></head><body><main class="app"><header class="header"><div><div class="subtitle">Mosslight Island · a tiny scientific adventure</div><h1>Little Lab <span style="color:#d1a87d">✦</span></h1></div><div class="stats"><span class="stat" id="day"></span><span class="stat" id="grants"></span><span class="stat" id="discoveries"></span></div></header><section class="stage"><canvas id="scene" width="1000" height="570" aria-label="Illustrated interactive island and laboratory"></canvas><div class="hud"><button id="mapBtn">Island</button><button id="labBtn">Laboratory</button><button id="journalBtn">Field journal</button></div><div class="hint" id="hint">Tap anywhere to walk. Tap illustrated objects to interact.</div></section><section class="below"><article class="panel"><h2>Today's little question</h2><p id="quest"></p><div class="actions"><button id="benchBtn">Research workbench</button><button id="nextBtn">Next morning</button></div></article><article class="panel"><h2>Your research cottage</h2><p id="labText"></p><div class="actions"><button id="shopBtn">Decorate cottage</button><button id="helpBtn">How to play</button></div></article></section></main><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="dialog"><button class="close" id="closeBtn" aria-label="Close dialog">Close</button><div id="content"></div></div></div><div class="toast" id="toast"></div><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');let scene='island',time=0,player={x:490,y:398,tx:490,ty:398},active=null,stage=0,selected=-1,sim='plant',simValue=50,trials=[];const initial={day:1,grants:25,done:[],inventory:[],decor:[],experiments:0};let state;try{state={...initial,...JSON.parse(localStorage.getItem('littleLabV3')||'{}')}}catch{state={...initial}};const save=()=>{localStorage.setItem('littleLabV3',JSON.stringify(state));renderUI()};const studies=[{id:'pond',name:'The Blooming Pond',item:'Pond-water sample',question:'Does extra sunlight increase algae growth?',hypotheses:['More light can increase growth','Jar color alone determines growth','All conditions always give equal growth'],designs:['Keep nutrients, water and temperature constant; change only light','Change light and nutrients together','Use two different ponds and two temperatures'],results:'After seven days, the bright group averaged 18 algae clusters and the shaded group averaged 6.',conclusions:['These results support an effect of light under the tested conditions','Light is the only possible factor in every pond','The experiment proves nutrients are irrelevant'],fact:'A controlled experiment changes one independent variable while holding other conditions constant.'},{id:'forest',name:'The Squirrels’ Memory',item:'Field observation notes',question:'Can visible landmarks help squirrels locate stored food?',hypotheses:['Landmarks might support spatial recall','Memory cannot be measured behaviorally','Landmarks always prevent retrieval'],designs:['Use equal delays and trials, varying only landmark visibility','Change both food and delay for one group','Let one group practice more often'],results:'Squirrels found 8/10 caches with landmarks, versus 5/10 without.',conclusions:['Landmarks may aid spatial recall in this task','Every species remembers in exactly the same way','This proves the squirrels used no other cues'],fact:'Behavioural research uses measurable outcomes and avoids conclusions broader than the data.'},{id:'garden',name:'The Shy Seedlings',item:'Seed specimen',question:'Does light exposure affect seedling growth?',hypotheses:['Growth may differ with light exposure','Water is never relevant to plants','All seedlings grow identically'],designs:['Use the same soil, water and seed type, varying light only','Water one plant twice as much and change its light','Compare unrelated plant species outdoors'],results:'After ten days, seedlings under moderate light averaged 11 cm, and shaded seedlings averaged 5 cm.',conclusions:['Light may affect growth under these conditions','All plants need exactly the same amount of light','The data show temperature caused the difference'],fact:'Replication and careful measurement help separate a repeatable effect from chance.'}];const shop=[['plant','Hanging fern',15],['books','Bookshelf',20],['lamp','Reading lamp',25],['telescope','Brass telescope',35],['cat','Sleepy lab cat',50]];
function round(x,y,w,h,r,fill,stroke,lw=2){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}function ellipse(x,y,rx,ry,c){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function poly(points,c,stroke){ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.closePath();ctx.fillStyle=c;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}}function line(x,y,x2,y2,c,w=3){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke()}function label(t,x,y,size=17,color='#53664e',align='center'){ctx.fillStyle=color;ctx.textAlign=align;ctx.font=`600 ${size}px DM Sans, sans-serif`;ctx.fillText(t,x,y)}function flower(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);line(0,1,0,12,'#779b6c',2);for(let i=0;i<5;i++){let a=i*Math.PI*2/5;ellipse(Math.cos(a)*6,Math.sin(a)*6,5,5,'#fff8ec')}ellipse(0,0,3.7,3.7,'#eac478');ctx.restore()}function tree(x,y,s=1,tint=0){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(9,15,49,15,'#8ba88355');poly([[-13,-10],[10,-12],[19,60],[-3,60]],'#9a7765');ellipse(-28,-26,47,36,tint?'#8fae81':'#7eab82');ellipse(16,-52,54,47,tint?'#a4bc8a':'#8bb38a');ellipse(53,-18,38,32,tint?'#98b884':'#83a982');ellipse(-9,-60,35,29,'#a9c694');ctx.restore()}function bush(x,y,s=1){ellipse(x,y,26*s,17*s,'#91b47e');ellipse(x-14*s,y-8*s,19*s,17*s,'#a3c38d');ellipse(x+12*s,y-10*s,18*s,17*s,'#8daf7d')}function rock(x,y,s=1){poly([[x-25*s,y+9*s],[x-19*s,y-15*s],[x+5*s,y-23*s],[x+26*s,y-5*s],[x+21*s,y+15*s]],'#a6aba7');poly([[x-19*s,y-15*s],[x+5*s,y-23*s],[x+2*s,y+7*s]],'#bfc1b9')}function character(x,y){ctx.save();ctx.translate(x,y+Math.sin(time*.004)*2);ellipse(1,22,24,7,'#557c6240');line(-7,6,-9,23,'#f4d6be',6);line(8,6,10,23,'#f4d6be',6);ellipse(0,-1,19,23,'#6f9467');ellipse(-19,-10,7,18,'#523d36');ellipse(15,-13,8,19,'#523d36');ellipse(0,-20,19,18,'#f5d9c6');ellipse(0,-33,22,13,'#493b38');ellipse(-13,-24,7,10,'#493b38');ellipse(13,-25,8,10,'#493b38');ellipse(-6,-18,1.7,2.4,'#3d3837');ellipse(7,-18,1.7,2.4,'#3d3837');ctx.beginPath();ctx.arc(1,-14,4,.15,Math.PI-.15);ctx.strokeStyle='#b87878';ctx.lineWidth=1.5;ctx.stroke();line(-16,-1,-23,8,'#f5d9c6',5);line(16,-1,23,8,'#f5d9c6',5);ctx.restore()}function cottage(){ellipse(277,359,154,34,'#6b946b55');round(163,196,222,161,14,'#f6e8cc','#b69b82',4);poly([[144,206],[269,105],[407,206]],'#bd8d81','#a87772');poly([[165,203],[270,122],[383,203]],'#d6a393');for(let i=0;i<6;i++)line(182+i*35,188,270,127,'#f2c6b5',1);round(245,255,65,102,[35,35,0,0],'#a6bd9c','#7e9989',4);ellipse(297,310,3.5,3.5,'#f6e4a5');round(180,231,47,48,7,'#c6e1d5','#ae9980',5);line(204,231,204,279,'#ae9980',3);line(180,255,227,255,'#ae9980',3);round(334,232,36,42,6,'#c6e1d5','#ae9980',4);line(351,233,351,272,'#ae9980',2);line(334,252,370,252,'#ae9980',2);for(let i=0;i<5;i++)ellipse(171+i*17,208,5,5,'#fff4bd');label('LITTLE LAB',274,224,14,'#7d8d70')}
function island(){ctx.fillStyle='#bcd49e';ctx.fillRect(0,0,1000,570);ellipse(830,90,340,160,'#c8dba7');ellipse(85,490,320,180,'#a9c891');ellipse(655,490,310,170,'#b1ce97');ctx.beginPath();ctx.moveTo(263,340);ctx.bezierCurveTo(335,380,383,397,420,568);ctx.lineTo(670,570);ctx.bezierCurveTo(570,393,430,325,333,318);ctx.fillStyle='#e8d2ab';ctx.fill();ctx.beginPath();ctx.ellipse(797,346,177,112,-.13,0,Math.PI*2);ctx.fillStyle='#e7dfb7';ctx.fill();ctx.beginPath();ctx.ellipse(797,346,161,97,-.13,0,Math.PI*2);ctx.fillStyle='#85bdba';ctx.fill();ctx.beginPath();ctx.ellipse(802,354,136,75,-.13,0,Math.PI*2);ctx.fillStyle='#79b4b3';ctx.fill();for(let i=0;i<8;i++)ellipse(705+i*24,340+Math.sin(i*1.7)*29,6,2,'#c4e5d7');tree(65,148,1.2);tree(507,128,1.05,1);tree(910,174,1.15);tree(40,440,.85,1);tree(604,84,.66);bush(576,277,1.3);bush(130,363,.9);bush(578,478,1.2);rock(689,246,1.1);rock(895,412,.8);for(let i=0;i<21;i++){let x=50+(i*137)%900,y=230+(i*79)%290;if(x>630&&x<940&&y>260&&y<430)continue;flower(x,y,.65+(i%3)*.15)}cottage();for(let i=0;i<5;i++)ellipse(725+i*16,290+(i%2)*5,11,6,'#86aa80');character(player.x,player.y);sign(590,209,'FOREST');sign(850,476,'POND');sign(106,491,'GARDEN');sign(276,383,'ENTER LAB');}
function sign(x,y,t){round(x-56,y-19,112,29,12,'#fff7e3e8','#d7c4a6',2);label(t,x,y,12,'#6b7b60')}
function book(x,y,w=28,h=36,c='#9cae90'){round(x,y,w,h,3,c,'#71836e',2);line(x+5,y+3,x+5,y+h-3,'#f1e6cc',2)}function pot(x,y){round(x-18,y,36,26,[3,3,10,10],'#c98f7c');line(x,y,x,y-37,'#71966f',4);for(let i=0;i<4;i++){ellipse(x+(i-1.5)*11,y-34+(i%2)*9,12,7,'#83a77d')}}function microscope(x,y){ctx.save();ctx.translate(x,y);line(-19,33,27,33,'#8d8175',8);line(3,31,12,-11,'#809b91',10);line(11,-11,-1,-23,'#809b91',10);line(-1,-23,8,-37,'#809b91',9);line(-6,-40,16,-40,'#d7bc91',8);line(-24,12,24,12,'#b0b2a3',7);ellipse(9,-4,11,11,'#d9caa8');ctx.restore()}function lab(){ctx.fillStyle='#eadcc6';ctx.fillRect(0,0,1000,570);poly([[0,0],[500,0],[500,330],[0,385]],'#dfc9b1');poly([[500,0],[1000,0],[1000,385],[500,330]],'#e9d7c1');for(let i=0;i<17;i++){line(i*61,0,i*61,345,'#f5e8d1',2)}for(let i=0;i<12;i++)line(0,i*32,1000,i*32,'#f1e4ce',2);poly([[0,380],[500,323],[1000,382],[1000,570],[0,570]],'#a58b78');for(let i=0;i<17;i++)line(0,386+i*19,1000,382+i*19,'#b69b86',2);for(let i=0;i<18;i++)line(i*66,375,i*66-90,570,'#947f70',2);round(130,82,160,160,10,'#f8f1dc','#a99078',8);round(143,95,134,135,4,'#b5d4c6');tree(180,165,.36);tree(250,190,.3);line(210,82,210,242,'#a99078',5);line(130,165,290,165,'#a99078',5);round(650,102,210,162,8,'#d0b49d','#9c8274',5);for(let i=0;i<3;i++){round(673,120+i*45,165,34,3,'#a58774');for(let j=0;j<4;j++)book(681+j*35,125+i*45,23,29,['#9eb9a5','#d6a68e','#d7c79e','#a6b8c5'][j])}round(290,310,405,31,7,'#b99579','#806e62',4);round(313,339,20,115,3,'#8d7365');round(657,339,20,115,3,'#8d7365');microscope(480,287);round(558,270,50,41,6,'#a9c8c3','#809f99');ellipse(584,268,23,6,'#d4e8d6');round(365,279,59,43,5,'#f4e9d4','#a99984');line(397,284,397,317,'#d4b89b',2);pot(205,346);round(82,355,125,23,5,'#a98870');round(100,375,15,85,3,'#a98870');round(182,375,15,85,3,'#a98870');round(735,340,138,112,9,'#e8d4b4','#ac9781',4);round(746,355,116,87,7,'#b7c9b2');if(state.decor.includes('plant'))pot(812,321);if(state.decor.includes('books')){book(96,314);book(128,313,27,37,'#d9a995')}if(state.decor.includes('lamp')){line(900,310,900,423,'#a68e79',5);poly([[866,314],[885,261],[919,261],[937,314]],'#f4dfb5');ellipse(901,323,55,13,'#ffe9b955')}if(state.decor.includes('telescope')){line(78,310,125,248,'#a69d87',10);line(115,252,157,222,'#b3c5ba',17);line(126,255,125,355,'#917c6d',5)}if(state.decor.includes('cat')){ellipse(804,412,28,13,'#bd9e85');ellipse(784,400,13,13,'#bd9e85');poly([[775,394],[779,381],[785,394]],'#bd9e85');poly([[786,394],[797,382],[796,397]],'#bd9e85')}character(555,426);sign(480,350,'WORKBENCH');sign(788,471,'DECORATE');label('A quiet place to wonder',503,58,20,'#847e69')}
function render(){time+=16;let dx=player.tx-player.x,dy=player.ty-player.y;if(scene==='island'&&Math.hypot(dx,dy)>2){player.x+=dx*.095;player.y+=dy*.095}ctx.clearRect(0,0,1000,570);scene==='island'?island():lab();requestAnimationFrame(render)}render();function renderUI(){$('day').textContent='Day '+state.day;$('grants').textContent=state.grants+' grants';$('discoveries').textContent=state.done.length+'/3 discoveries';$('quest').textContent=state.done.length===3?'You have completed all three island mysteries. Repeat simulations and make the cottage your own.':`Explore the ${studies.find(s=>!state.done.includes(s.id)).name.toLowerCase()} and design an experiment.`;$('labText').textContent=`${state.decor.length} furnishings collected · ${state.experiments} experiments recorded. Your research notes stay saved on this device.`;$('hint').textContent=scene==='island'?'Tap to walk · Tap the cottage, forest, pond or garden to investigate':'Tap the workbench, bookshelf or furnishings to interact'}renderUI();
function show(html){$('content').innerHTML=html;$('modal').classList.add('open')}function close(){$('modal').classList.remove('open')}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2300)}function setScene(s){scene=s;close();renderUI()}function investigate(id){active=studies.find(s=>s.id===id);if(!state.inventory.includes(active.item)){state.inventory.push(active.item);state.grants+=5;save()}show(`<h2>${active.name}</h2><p>${active.question}</p><div class="note">Field specimen: ${active.item}. ${state.done.includes(id)?'This study is in your journal. You can replicate it.':'A new research question is waiting.'}</div><button onclick="startStudy()">Begin investigation</button>`)}function startStudy(){stage=0;step()}function step(){const s=active;let head,prompt,choices;if(stage===0){head='Make a hypothesis';prompt=s.question;choices=s.hypotheses}else if(stage===1){head='Design a controlled experiment';prompt='Which design isolates the variable?';choices=s.designs}else if(stage===2){show(`<h2>Observe your results</h2><p>${s.results}</p><div class="note">These are fictional educational data, not findings from a published study.</div><button onclick="stage=3;step()">Interpret the evidence</button>`);return}else{head='Draw a conclusion';prompt='Which statement is supported by the observations?';choices=s.conclusions}show(`<h2>${stage+1}. ${head}</h2><p>${prompt}</p>${choices.map((c,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join('')}<div id="feedback"></div>`)}function answer(i){if(i!==0){$('feedback').innerHTML='<div class="note">Not quite. Look for a testable explanation that avoids changing several factors at once or overclaiming.</div>';return}stage++;if(stage===4){let fresh=!state.done.includes(active.id);if(fresh){state.done.push(active.id);state.grants+=35;state.experiments++;save()}show(`<h2>Discovery recorded</h2><p>${active.name} is now part of your field journal.</p><div class="note">${active.fact}</div><p>${fresh?'You earned 35 research grants.':'Replication is part of science.'}</p><button onclick="close()">Return to island</button>`)}else step()}
function journal(){show(`<h2>Your field journal</h2><p>Small observations, big questions.</p>${studies.map(s=>`<div class="note"><strong>${s.name}</strong> · ${state.done.includes(s.id)?'Study complete':'Not yet investigated'}<p>${state.done.includes(s.id)?s.fact:s.question}</p></div>`).join('')}<p class="mini">Specimens: ${state.inventory.join(', ')||'None collected yet'}</p>`)}function shopModal(){show(`<h2>The cottage catalogue</h2><p>Spend your research grants on little comforts. Owned furnishings appear as illustrated objects in the room.</p>${shop.map(([id,name,cost])=>`<button class="option" ${state.decor.includes(id)||state.grants<cost?'disabled':''} onclick="buy('${id}',${cost})">${name} · ${cost} grants ${state.decor.includes(id)?'· owned':''}</button>`).join('')}`)}function buy(id,cost){if(state.grants<cost||state.decor.includes(id))return;state.grants-=cost;state.decor.push(id);save();shopModal();toast('A new furnishing for the cottage')}function bench(){show(`<h2>Research workbench</h2><p>Explore a model by changing one variable and recording multiple trials.</p><div class="actions"><button onclick="simulation('plant')">Seedling growth</button><button onclick="simulation('memory')">Memory retention</button><button onclick="simulation('algae')">Pond algae</button></div><p class="mini">These models are illustrative, not experimental measurements.</p>`)}function model(v){return sim==='plant'?Math.round((2+11*Math.exp(-Math.pow((v-65)/37,2)))*10)/10:sim==='memory'?Math.round((2+8*Math.exp(-v/42))*10)/10:Math.round((4+.16*v)*10)/10}function simulation(type){sim=type;simValue=50;trials=[];drawSimulation()}function drawSimulation(){let name={plant:'Seedling growth',memory:'Memory retention',algae:'Pond algae'}[sim],axis=sim==='memory'?'Retention delay (minutes)':'Light exposure (%)';show(`<h2>${name}</h2><p>Keep all other factors constant. Adjust <strong>${axis.toLowerCase()}</strong> and record at least two trials.</p><div class="note"><label>${axis}: <strong id="value">${simValue}</strong></label><p><input class="slider" type="range" min="0" max="100" value="${simValue}" oninput="simValue=+this.value;document.getElementById('value').textContent=this.value;document.getElementById('prediction').textContent=model(simValue)"></p><p>Model prediction: <strong id="prediction">${model(simValue)}</strong></p><button onclick="record()">Record trial</button></div>${trials.length?`<div class="chart">${trials.map(t=>`<div class="bar" style="height:${Math.max(4,t.y/22*100)}%"><span>${t.y}</span></div>`).join('')}</div><p class="mini">Conditions: ${trials.map(t=>t.x).join(' · ')}</p>`:'<p class="mini">No observations recorded yet.</p>'}<div class="actions"><button onclick="bench()">Back</button>${trials.length>=2?'<button onclick="fileNotes()">File research notes</button>':''}</div>`)}function record(){if(trials.length>=6){toast('Six trials per experiment');return}trials.push({x:simValue,y:model(simValue)});drawSimulation()}function fileNotes(){state.grants+=10;state.experiments++;save();show('<h2>Research notes filed</h2><p>You earned 10 research grants.</p><div class="note">A model can illustrate a scientific relationship, but real experiments also require uncertainty estimates, repeated measurements and validation.</div><button onclick="bench()">Return to workbench</button>')}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1000,y=(e.clientY-r.top)/r.height*570;if(scene==='lab'){if(x>340&&x<670&&y>215&&y<375)bench();else if(x>700&&y>290)shopModal();else if(x>640&&y<290)journal();else{toast('Explore the workbench or the bookshelf')}return}if(x>145&&x<410&&y>110&&y<365){setScene('lab');return}if(x>620&&y>260&&y<455){investigate('pond');return}if(x>445&&y<250||x>875&&y<260){investigate('forest');return}if(x<210&&y>375||x<150&&y<230){investigate('garden');return}player.tx=Math.max(30,Math.min(970,x));player.ty=Math.max(240,Math.min(525,y))});$('mapBtn').onclick=()=>setScene('island');$('labBtn').onclick=()=>setScene('lab');$('journalBtn').onclick=journal;$('benchBtn').onclick=bench;$('shopBtn').onclick=shopModal;$('nextBtn').onclick=()=>{state.day++;save();toast('A fresh morning begins')};$('helpBtn').onclick=()=>show('<h2>Welcome to Mosslight Island</h2><p>Tap to move your little researcher around the island. Visit the pond, forest and garden to investigate scientific mysteries. Enter the cottage to use the research workbench, browse your journal and furnish your space.</p><p>Choose hypotheses, isolate variables and draw cautious conclusions. Research earns grants. Progress saves in this browser.</p><p class="mini">All experiments use fictional illustrative datasets.</p><button onclick="if(confirm(\'Erase saved progress?\')){state=structuredClone(initial);save();close()}">Reset progress</button>');$('closeBtn').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script></body></html>
